name: Sync Live Source
on:
  schedule:
    - cron: '0 */4 * * *'   # UTC时间，每4小时跑一次，一天6次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Sync remote source and generate live.m3u
        run: python script/sync.py

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add live.m3u
          git commit -m "auto sync live source"
          git push
