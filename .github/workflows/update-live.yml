name: Update Live Source
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: pip install requests

      - name: Run script generate m3u
        run: python script/get_live.py

      - name: Upload m3u as artifact
        uses: actions/upload-artifact@v4
        with:
          name: live-m3u
          path: live.m3u
